# Prometheus configuration for Archivio Parlante

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'archivio-parlante'
    environment: 'dev'

# Scrape targets
scrape_configs:
  # === Prometheus self-monitoring ===
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # === Rust Engine metrics ===
  - job_name: 'rust-engine'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rust-engine:8090']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'rust-engine'

  # === PHP Gateway metrics (TO BE IMPLEMENTED) ===
  - job_name: 'php-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['php-gateway:9080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'php-gateway'

  # === Python Worker metrics (TO BE IMPLEMENTED) ===
  - job_name: 'python-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['python-worker:8091']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'python-worker'

  # === Node Exporter (host metrics) ===
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # === cAdvisor (container metrics) ===
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # === Qdrant vector DB ===
  - job_name: 'qdrant'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['qdrant:6333']
