[package]
name = "archivio-parlante-rust-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "archivio-parlante-rust-engine"
path = "src/main.rs"

[lib]
name = "archivio_parlante_rust_engine"
path = "src/lib.rs"

[dependencies]
# Web framework
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Qdrant client (sarà usato in Fase 1)
qdrant-client = "1.12"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Date/Time
chrono = "0.4"

# Environment
dotenvy = "0.15"

# Tokenization
tiktoken-rs = "0.5"

# Regex
regex = "1"

# Concurrent data structures
dashmap = "6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
